name: Publish Release

# Run by hand once the App Store version is live. Publishes the draft GitHub Release that Prepare
# Release made, on the commit of the build Apple shipped (its build/<version>/<build> tag), which
# creates the version tag there. Then it rebuilds babybuddy.app so /whatsnew/ shows it. Uploads nothing: the App Store is the only place a build comes from.
#
# Safe to run early or twice. Before Apple reports the version as live it stops without changing
# anything; once the release is public it skips straight to the website rebuild.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The App Store version, e.g. 1.1.0
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # publish the release, which creates the tag

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment holds the App Store Connect key and the deploy hook, and only hands them to
    # `main` — that policy is the real guard, since a run from another branch uses that branch's
    # copy of this file. The first step only says so more clearly.
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::run this from main, not $GITHUB_REF"; exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::\"$VERSION\" is not a version number"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build tags, and main's history to check them against

      # `gh release view` finds drafts; the REST "release by tag" endpoint does not.
      - name: Find the GitHub Release
        id: release
        run: |
          if ! gh release view "$TAG" --json isDraft > release.json; then
            echo "::error::no GitHub Release for $TAG — run Prepare Release first"; exit 1
          fi
          echo "draft=$(jq -r .isDraft release.json)" >> "$GITHUB_OUTPUT"

      - name: The App Store version is live
        id: asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
        run: |
          node scripts/release.mjs status "$VERSION" | tee status.txt
          STATE=$(grep '^state=' status.txt | cut -d= -f2)
          echo "build=$(grep '^build=' status.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          # A version submitted for manual release waits at PENDING_DEVELOPER_RELEASE until it is
          # released in App Store Connect. Refusing then is the point, not a fault.
          if [ "$STATE" != "READY_FOR_DISTRIBUTION" ]; then
            echo "::error::$VERSION is $STATE, not READY_FOR_DISTRIBUTION — nothing was published"; exit 1
          fi

      # Every upload pushes build/<version>/<build> on the commit it was archived from. The build
      # number is set at archive time, not committed, so that tag is the only record of which
      # commit Apple shipped. Whatever the draft targets now, the release goes there.
      - name: The build Apple shipped has a build tag on main
        id: shipped
        if: steps.release.outputs.draft == 'true'
        env:
          ASC_BUILD: ${{ steps.asc.outputs.build }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          BUILD_TAG="build/$VERSION/$ASC_BUILD"
          SHA=$(git rev-parse -q --verify "refs/tags/$BUILD_TAG^{commit}") \
            || fail "Apple shipped build $ASC_BUILD, but there is no $BUILD_TAG tag. Push one on the commit that build was archived from"
          git merge-base --is-ancestor "$SHA" origin/main || fail "$BUILD_TAG ($SHA) is not on main"

          field() { git show "$SHA:project.yml" | sed -nE "s/^ *$1: *\"?([^\"]*)\"? *$/\1/p" | head -1; }
          [ "$(field MARKETING_VERSION)" = "$VERSION" ] || fail "MARKETING_VERSION at $SHA is $(field MARKETING_VERSION), not $VERSION"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          git show "$SHA:Docs/release-notes.md" > "$RUNNER_TEMP/release-notes.md"
          RELEASE_NOTES="$RUNNER_TEMP/release-notes.md" node scripts/release.mjs body "$VERSION" > "$RUNNER_TEMP/body.md"

      - name: Publish
        if: steps.release.outputs.draft == 'true'
        run: |
          gh release edit "$TAG" --target "${{ steps.shipped.outputs.sha }}" \
            --notes-file "$RUNNER_TEMP/body.md" --draft=false --latest
          if [ "$(gh release view "$TAG" --json assets --jq '.assets | length')" != "0" ]; then
            echo "::warning::$TAG has uploaded assets — releases are meant to carry none"
          fi

      - name: Already public
        if: steps.release.outputs.draft != 'true'
        run: echo "$TAG is already published — only rebuilding the website" >> "$GITHUB_STEP_SUMMARY"

      # Called from here rather than an `on: release` workflow: a release published with
      # GITHUB_TOKEN does not fire one.
      # The query string changes each try so the poll never reads an edge-cached copy. Cloudflare
      # builds the site in under a minute, so five minutes is generous: a miss means the build
      # failed or the hook was dropped, and one more hook covers a dropped request. A second miss
      # fails the job, so the failure email says which part of the release did not land — the
      # GitHub Release above is already valid either way.
      - name: Rebuild babybuddy.app and check /whatsnew/ shows the version
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          PATTERN=">Version ${VERSION//./\\.}<"
          shows() { curl -fsS "https://babybuddy.app/whatsnew/?run=$GITHUB_RUN_ID-$1" | grep -qE "$PATTERN"; }
          for ATTEMPT in 1 2; do
            curl -fsS -X POST "$HOOK" -o /dev/null && echo "website build requested (attempt $ATTEMPT)"
            for TRY in $(seq 1 15); do
              sleep 20
              if shows "$ATTEMPT-$TRY"; then
                echo "babybuddy.app/whatsnew/ shows $VERSION (build attempt $ATTEMPT)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
              fi
            done
            [ "$ATTEMPT" = 1 ] && echo "::warning::babybuddy.app/whatsnew/ did not show $VERSION five minutes after the first build; requesting another"
          done
          echo "::error::babybuddy.app/whatsnew/ still does not show $VERSION after two site builds — check the Cloudflare build log for babybuddyweb"
          exit 1
