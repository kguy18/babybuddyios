name: BabyBuddy
options:
  bundleIdPrefix: com.kurtisguy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.14.1
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    majorVersion: 5.0.0

settings:
  base:
    # Applies to the app and the widget extension alike — App Store Connect rejects an upload whose
    # extension version doesn't match the app's. Bump CURRENT_PROJECT_VERSION for every upload: a
    # build number may only be used once per MARKETING_VERSION.
    #
    # MARKETING_VERSION is the App Store version, and a new one sends the TestFlight build through
    # App Store review. NEVER bump it unprompted — "bump the version" means the build number below.
    # It changes only when the owner asks for a release.
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "547DWTTFY6"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BabyBuddy:
    type: application
    platform: iOS
    sources:
      - path: Sources
    configFiles:
      Debug: Config/BabyBuddy.xcconfig
      Release: Config/BabyBuddy.xcconfig
    dependencies:
      - target: BabyBuddyWidgets
      - package: TelemetryDeck
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kurtisguy.BabyBuddy
        # iPhone only. Archive validation rejects a universal app that declares just one interface
        # orientation: iPad demands all four for multitasking. Baby Buddy is portrait-locked with no
        # iPad layout — no size classes, no split view — and the old opt-out (UIRequiresFullScreen)
        # is deprecated as of iPadOS 26, so iPhone-only is the honest declaration. iPad owners can
        # still install it and run it in iPhone compatibility mode.
        #
        # This must be set per target: XcodeGen's iOS platform preset writes "1,2" at the target
        # level, which beats anything in the project-wide `settings:` block above. Keep the widget
        # and test targets in step.
        TARGETED_DEVICE_FAMILY: "1"
        # The Home Screen label. Without this it falls back to the product name, "BabyBuddy" — no
        # space. Matches the widget's display name below; the store name ("Baby Buddy Companion")
        # is deliberately not used here, as the Home Screen truncates past ~12 characters.
        INFOPLIST_KEY_CFBundleDisplayName: "Baby Buddy"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The five alternates offered by Settings ▸ App Icon. Xcode turns this list into the
        # CFBundleIcons/CFBundleAlternateIcons entries `setAlternateIconName` resolves against;
        # a name missing here fails at runtime, so keep it in step with ``AppIconOption``.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconHappyLowPeek AppIconLowPeek AppIconPeekWave AppIconSidePeekLeft AppIconSidePeekRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Baby Buddy uses Face ID to keep your baby's data private."
        INFOPLIST_KEY_NSCameraUsageDescription: "Baby Buddy uses the camera to scan the login QR code from your server's Add a Device page."
        INFOPLIST_KEY_UIBackgroundModes: "fetch"
    info:
      path: Sources/Info.plist
      properties:
        TelemetryDeckAppID: "$(TELEMETRYDECK_APP_ID)"
        TelemetryDeckSalt: "$(TELEMETRYDECK_SALT)"
        RevenueCatAPIKey: "$(REVENUECAT_API_KEY)"
        NSSupportsLiveActivities: true
        # The app uses only Apple-provided HTTPS and the platform Keychain — exempt encryption.
        # Declaring it here answers the export-compliance question at build time; without it every
        # single upload sits in App Store Connect waiting on the questionnaire before it can reach
        # a tester.
        ITSAppUsesNonExemptEncryption: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.kurtisguy.BabyBuddy.sync
        CFBundleURLTypes:
          - CFBundleURLName: com.kurtisguy.BabyBuddy
            CFBundleURLSchemes:
              - babybuddy
    entitlements:
      path: Sources/BabyBuddy.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:babybuddy.app
          - applinks:www.babybuddy.app
        com.apple.security.application-groups:
          - group.com.kurtisguy.BabyBuddy
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kurtisguy.BabyBuddy

  BabyBuddyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Sources/Persistence
        excludes:
          - DemoData.swift
      - path: Sources/Networking
      - path: Sources/Auth/KeychainStore.swift
      - path: Sources/Shared
      - path: Sources/Analytics
    configFiles:
      Debug: Config/BabyBuddy.xcconfig
      Release: Config/BabyBuddy.xcconfig
    dependencies:
      - package: TelemetryDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kurtisguy.BabyBuddy.Widgets
        INFOPLIST_KEY_CFBundleDisplayName: "Baby Buddy"
        # Match the host app — an embedded extension may not target devices the app doesn't.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widgets/Info.plist
      properties:
        TelemetryDeckAppID: "$(TELEMETRYDECK_APP_ID)"
        TelemetryDeckSalt: "$(TELEMETRYDECK_SALT)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/BabyBuddyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kurtisguy.BabyBuddy
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kurtisguy.BabyBuddy

  BabyBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BabyBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kurtisguy.BabyBuddy.tests
        # Match the host app so the test bundle runs on the same destinations.
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  BabyBuddy:
    build:
      targets:
        BabyBuddy: all
        BabyBuddyTests: [test]
    run:
      # Synthetic local store for the supporter tips — lets purchases be exercised in the simulator
      # with no App Store Connect / RevenueCat account. See Docs/InAppPurchaseTesting.md.
      storeKitConfiguration: Config/BabyBuddy.storekit
    test:
      targets:
        - BabyBuddyTests
