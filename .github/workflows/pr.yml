name: PR

on:
  pull_request:

# A new push cancels the in-flight run for the same PR.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # the attribution job reads the PR body

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this PR touch anything the app build depends on?
        id: filter
        # Anything not recognised as docs counts as code, so an unfamiliar path
        # builds rather than slips through. `grep -v` without `-q`: ugrep (the
        # Mac's grep) inverts `-vq` as a whole-input test, not per line.
        run: |
          CODE=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
                 | grep -vE '\.md$|^Docs/|^\.github/(ISSUE_TEMPLATE/|pull_request_template)' | head -1)
          if [ -n "$CODE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "touches $CODE (and maybe more): building"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "docs-only PR: skipping the macOS build"
          fi
      # Sharding the UI suite means a class nobody assigned to a shard simply never runs, and a
      # green tick is exactly what that looks like. This is the guard: each sharded job (ui, duo)
      # has to name every test class in UITests/, and only classes that exist.
      - name: Every UI test class belongs to a shard
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          workflow = pathlib.Path(".github/workflows/pr.yml").read_text()
          # One class per file, named after it (UITestCase is the base class, and has no tests).
          onDisk = {p.stem for p in pathlib.Path("UITests").glob("*.swift")
                    if "func test" in p.read_text()}
          failed = False
          # Split the file at each job (two-space indent) and check the jobs that list classes.
          for job in re.split(r"^  (?=[a-z-]+:$)", workflow, flags=re.M)[1:]:
              sharded = {c for line in re.findall(r"^\s*classes:\s*(.+)$", job, re.M) for c in line.split()}
              if not sharded:
                  continue
              name = job.split(":", 1)[0]
              for what, names in (("never run", onDisk - sharded), ("do not exist", sharded - onDisk)):
                  if names:
                      failed = True
                      print(f"::error::{name}: UI test classes that {what}: {', '.join(sorted(names))}")
              if sharded == onDisk:
                  print(f"{name}: {len(onDisk)} UI test classes, all sharded")
          sys.exit(1 if failed else 0)
          PY

  # The three macOS lanes below used to be one job that ran them in sequence, which took ~53
  # minutes: 6 for the build and unit tests, 35 for the UI tests, 10 for the server ones. They
  # depend only on `changes`, not on each other — a run that reports every failure at once is worth
  # more than one that stops at the first, and runner minutes are free on a public repository.
  #
  # macos-26 is pinned rather than macos-latest: the suite needs iOS 26+, and -latest moves to the
  # next major on GitHub's schedule, not ours. That image is Apple Silicon with Xcode 26.6 as
  # default and iOS 26.2/26.4/26.5 simulator runtimes.

  unit:
    name: unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # On iOS 26 SwiftUI shows a confirmationDialog as a popover and UIKit drops its
      # cancel action — a destructive prompt with no way back shipped three times
      # (#89, #90, #119). `git grep`, not grep: it behaves the same here and on a
      # dev Mac, where plain grep may be ugrep.
      - name: No confirmationDialog
        run: |
          if git grep -n '\.confirmationDialog(' -- Sources Widgets; then
            echo "::error::confirmationDialog loses its Cancel on iOS 26 — use .alert or a design-system dialog (CLAUDE.md ▸ UI)"
            exit 1
          fi
      - uses: ./.github/actions/ios-setup
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(python3 -c '
          import json, subprocess, sys
          NAME = "CI-BabyBuddy"
          devs = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          for rt, ds in sorted(devs.items(), reverse=True):
              if "iOS" not in rt: continue
              for d in ds:
                  if d["name"] == NAME:
                      print(d["udid"]); sys.exit()
          for rt, ds in sorted(devs.items(), reverse=True):
              if "iOS" not in rt: continue
              for d in ds:
                  if d["name"].startswith("iPhone"):
                      print(subprocess.check_output(
                          ["xcrun", "simctl", "create", NAME, d["deviceTypeIdentifier"], rt],
                          text=True).strip())
                      sys.exit()
          sys.exit("no iPhone simulator available")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      # The scheme builds BabyBuddyWidgets as a dependency, so this also catches an
      # app-only import sneaking into Sources/Shared or Sources/Persistence, which
      # compile into the widget target too.
      - name: Build and test
        run: |
          xcodebuild -project BabyBuddy.xcodeproj -scheme BabyBuddy \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/Tests.xcresult \
            test CODE_SIGNING_ALLOWED=NO -quiet
      # `-quiet` prints nothing on success, so a green run would otherwise never
      # say how many tests ran — including if it ran none.
      - name: Test summary
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path build/Tests.xcresult --format json \
            | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          print("{result}: {passedTests}/{totalTestCount} passed, {failedTests} failed, {skippedTests} skipped".format(**d))
          for t in d.get("testFailures", []):
              print("  FAIL {}.{}: {}".format(t.get("targetName"), t.get("testName"), t.get("failureText")))
          sys.exit(0 if d.get("failedTests", 1) == 0 and d.get("totalTestCount", 0) > 0 else 1)
          '

  # The XCUITest suite, split four ways. Each shard is a whole test class or three: xcodebuild has
  # no sharding of its own, and a class is the smallest unit `-only-testing` addresses that doesn't
  # need a generated list kept in step with the source.
  #
  # The grouping is balanced by measured duration, not by test count — DashboardTests is two tests
  # and 95 seconds, TimerTests is three and the same. Re-measure from a result bundle
  # (`xcresulttool get test-results tests`) if the balance drifts.
  #
  # Four shards, not more: LoggingTests alone is ~21% of the suite, so it is the floor no split of
  # whole classes can beat. A fifth shard would shave nothing off the critical path.
  ui:
    name: ui (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      # One shard failing shouldn't hide the results of the other three.
      fail-fast: false
      matrix:
        include:
          - shard: logging
            classes: LoggingTests SickModeTests TodayTilesTests
          - shard: timers
            classes: LiveActivityTests SmokeTests TimerTests FoldTests
          - shard: timeline
            classes: TimelineTests DialogTests SyncTests ReassignChildTests
          - shard: settings
            classes: NotificationTests SettingsTests FeedbackTests FeedbackAccountTests DashboardTests GermanLocalizationTests PortugueseLocalizationTests
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-setup
      # Iterations are 2 so a test gets exactly one retry: one absorbs a simulator
      # hiccup; a test that needs it every run gets fixed, not retried.
      #
      # scripts/ui-test.sh creates and erases its own device, so each shard gets a clean one, and
      # `-only-testing` with an unknown class name fails the run rather than passing with zero tests.
      - name: UI tests
        id: ui
        run: |
          ONLY=""
          for CLASS in ${{ matrix.classes }}; do
            ONLY="$ONLY -only-testing:BabyBuddyUITests/$CLASS"
          done
          scripts/ui-test.sh \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -retry-tests-on-failure -test-iterations 2 \
            $ONLY
      - name: Upload the UI test result bundle
        # Demo data only (the seed and the tests' own records), with a screenshot
        # of every failure — the runner is discarded when the job ends. The name
        # carries the shard: upload-artifact rejects two uploads sharing one name.
        if: ${{ !cancelled() && steps.ui.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: UITests-${{ matrix.shard }}.xcresult
          path: build/UITests.xcresult
          retention-days: 7

  # The demo server lane: a real sign-in, push, pull, conflict and rejection against the Baby Buddy
  # server App Review also uses. Its own cap, so a hang in the network fails this job rather than
  # eating an hour.
  #
  # Deliberately NOT sharded, and never to be: all six tests sign into one shared server, so two of
  # them running at once would see each other's records. One test's teardown could delete the sleep
  # another test's Repeat is meant to overlap, for example. The tests skip themselves
  # if the server is unreachable, and the summary raises a warning when they do.
  #
  # Its result bundle is deliberately NOT uploaded: this repository is public, and XCUITest records
  # typed text — including the token the sign-in types.
  server:
    name: server
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # A fork's PR gets no secrets, and `secrets` can't be read from a step's `if` — so the lane's
      # condition rides on this instead, and skips there rather than failing the job.
      HAS_DEMO_SERVER: ${{ secrets.BB_E2E_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-setup
      - name: Server UI tests
        if: env.HAS_DEMO_SERVER == 'true'
        env:
          BB_E2E_SERVER_URL: ${{ secrets.BB_E2E_SERVER_URL }}
          BB_E2E_TOKEN: ${{ secrets.BB_E2E_TOKEN }}
        run: |
          scripts/ui-test.sh --server \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -retry-tests-on-failure -test-iterations 2

  # The iPhone Duo lane, on GitHub's preview `xcode-27` image (Xcode 27.1 by default, with an
  # iPhone Duo simulator on iOS 27.1). A preview image can queue, so `build-and-test` does not
  # need these jobs and the ruleset does not require them: a red run here is a signal, not a block.
  # They wait for `build-and-test` so they don't hold the macOS runners the required lanes need.
  #
  # The UI tests run on the Duo's front display, where the tabs and the main screen's bar buttons
  # sit in a trailing rail (`UITestCase.hasRail`). XCUITest can't unfold it, so FoldTests skip
  # there and run in `duo (open)`, which unfolds it with duoctl. Tests that leave the app skip on
  # the Duo: its simulator ignores the Home button.
  #
  # Building takes this image about 12 minutes, so `duo (build)` builds the UI tests once and the
  # seven shards run that build. With a build each, the shards ran 28 minutes against the 30-minute
  # cap, and the whole suite in one job ran past 85.
  duo-unit:
    name: duo (unit)
    needs: [changes, build-and-test]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: ./.github/actions/ios-setup
      # Clone the image's iPhone Duo (device type and runtime) into a device of our own name, which
      # scripts/ui-test.sh then erases and boots in place of its iPhone 17 Pro.
      - name: Pick an iPhone Duo simulator
        id: sim
        run: |
          UDID=$(python3 -c '
          import json, subprocess, sys
          NAME = "BabyBuddy UI Tests Duo"
          devs = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          for rt, ds in sorted(devs.items(), reverse=True):
              if "iOS-27" not in rt: continue
              for d in ds:
                  if d["name"] == NAME:
                      print(d["udid"]); sys.exit()
          for rt, ds in sorted(devs.items(), reverse=True):
              if "iOS-27" not in rt: continue
              for d in ds:
                  if d["name"].startswith("iPhone Duo"):
                      print(subprocess.check_output(
                          ["xcrun", "simctl", "create", NAME, d["deviceTypeIdentifier"], rt],
                          text=True).strip())
                      sys.exit()
          sys.exit("no iPhone Duo simulator on an iOS 27 runtime")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - name: Unit tests
        id: unit
        run: |
          xcodebuild -project BabyBuddy.xcodeproj -scheme BabyBuddy \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/Tests.xcresult \
            test CODE_SIGNING_ALLOWED=NO -quiet
      - name: Upload the result bundle
        if: ${{ !cancelled() && steps.unit.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Duo-unit.xcresult
          path: build/Tests.xcresult
          retention-days: 7

  duo-build:
    name: duo (build)
    needs: [changes, build-and-test]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: ./.github/actions/ios-setup
      - name: Build the UI tests
        run: |
          xcodebuild -project BabyBuddy.xcodeproj -scheme BabyBuddyUITests \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            build-for-testing CODE_SIGNING_ALLOWED=NO -quiet
          tar -C build/DerivedData/Build -czf build/duo-products.tgz Products
          ls -lh build/duo-products.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: duo-products
          path: build/duo-products.tgz
          retention-days: 1

  duo:
    name: duo (${{ matrix.shard }})
    needs: [changes, duo-build]
    if: ${{ !cancelled() && needs.duo-build.result == 'success' }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: feedback
            classes: FeedbackTests
          - shard: account
            classes: FeedbackAccountTests TodayTilesTests
          - shard: logging
            classes: LoggingTests
          - shard: settings
            classes: SettingsTests NotificationTests DashboardTests GermanLocalizationTests PortugueseLocalizationTests
          - shard: dialogs
            classes: DialogTests SyncTests ReassignChildTests
          - shard: timers
            classes: TimerTests LiveActivityTests SmokeTests
          - shard: timeline
            classes: TimelineTests SickModeTests FoldTests
    steps:
      - uses: actions/checkout@v4
      # Clone the image's iPhone Duo (device type and runtime) into a device of our own name, which
      # scripts/ui-test.sh then erases and boots in place of its iPhone 17 Pro.
      - name: Pick an iPhone Duo simulator
        id: sim
        run: |
          UDID=$(python3 -c '
          import json, subprocess, sys
          NAME = "BabyBuddy UI Tests Duo"
          devs = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          for rt, ds in sorted(devs.items(), reverse=True):
              if "iOS-27" not in rt: continue
              for d in ds:
                  if d["name"] == NAME:
                      print(d["udid"]); sys.exit()
          for rt, ds in sorted(devs.items(), reverse=True):
              if "iOS-27" not in rt: continue
              for d in ds:
                  if d["name"].startswith("iPhone Duo"):
                      print(subprocess.check_output(
                          ["xcrun", "simctl", "create", NAME, d["deviceTypeIdentifier"], rt],
                          text=True).strip())
                      sys.exit()
          sys.exit("no iPhone Duo simulator on an iOS 27 runtime")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - uses: actions/download-artifact@v4
        with:
          name: duo-products
          path: build
      # One retry per test, as in the ui lane.
      - name: UI tests
        id: ui
        env:
          UI_TEST_DEVICE: BabyBuddy UI Tests Duo
        run: |
          mkdir -p build/DerivedData/Build
          tar -C build/DerivedData/Build -xzf build/duo-products.tgz
          export UI_TEST_XCTESTRUN=$(ls build/DerivedData/Build/Products/*.xctestrun | head -1)
          ONLY=""
          for CLASS in ${{ matrix.classes }}; do
            ONLY="$ONLY -only-testing:BabyBuddyUITests/$CLASS"
          done
          scripts/ui-test.sh -retry-tests-on-failure -test-iterations 2 $ONLY
      - name: Upload the result bundle
        if: ${{ !cancelled() && steps.ui.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Duo-${{ matrix.shard }}.xcresult
          path: build/UITests.xcresult
          retention-days: 7

  # The Duo's open display, the only place FoldTests run: `scripts/ui-test.sh --duo-open` unfolds
  # the simulator with duoctl (pinned in scripts/duoctl), fails unless the inner screen took over,
  # then runs FoldTests and SmokeTests there without BB_FOLD. duoctl drives private simulator
  # interfaces, so a new Xcode on this image can break this job without a change of ours.
  duo-open:
    name: duo (open)
    needs: [changes, duo-build]
    if: ${{ !cancelled() && needs.duo-build.result == 'success' }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: duo-products
          path: build
      # scripts/duoctl downloads duoctl once per pinned revision; keep it so a DNS hiccup on the
      # runner can't fail the lane.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/babybuddy-duoctl
          key: duoctl-${{ hashFiles('scripts/duoctl') }}
      - name: UI tests on the open display
        id: ui
        run: |
          mkdir -p build/DerivedData/Build
          tar -C build/DerivedData/Build -xzf build/duo-products.tgz
          export UI_TEST_XCTESTRUN=$(ls build/DerivedData/Build/Products/*.xctestrun | head -1)
          scripts/ui-test.sh --duo-open -retry-tests-on-failure -test-iterations 2
      - name: Upload the result bundle and a screenshot
        if: ${{ !cancelled() && steps.ui.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Duo-open
          path: |
            build/UITests-duo-open.xcresult
            build/duo-open.png
          if-no-files-found: ignore
          retention-days: 7

  # The ruleset on main requires a check called `build-and-test`, which used to be the single macOS
  # job. Rather than teach the ruleset four shard names — which would strand it again the next time
  # the split changes — that name lives on here as an aggregator over the lanes. It is the only
  # place the shard layout is coupled to a repository setting, and now it isn't.
  #
  # `always()` so it still reports when a lane fails, and a skipped lane passes: on a docs-only PR
  # the three macOS jobs don't run at all.
  build-and-test:
    name: build-and-test
    # `changes` is here because a failure there skips every macOS lane, and `skipped` passes:
    # #197 went green with no tests run. It runs on every PR, docs-only ones included, so it
    # has to succeed; only the lanes it gates may be skipped.
    needs: [changes, unit, ui, server, release-notes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every lane passed
        run: |
          if [ "${{ needs.changes.result }}" != success ]; then
            echo "::error::changes did not pass (${{ needs.changes.result }})"
            exit 1
          fi
          for LANE in "unit=${{ needs.unit.result }}" \
                      "ui=${{ needs.ui.result }}" \
                      "server=${{ needs.server.result }}" \
                      "release-notes=${{ needs.release-notes.result }}"; do
            echo "$LANE"
            case "${LANE#*=}" in
              success|skipped) ;;
              *) FAILED=1 ;;
            esac
          done
          if [ -n "${FAILED:-}" ]; then
            echo "::error::a test lane did not pass"
            exit 1
          fi

  # Docs/release-notes.md is sent to App Store Connect verbatim and bundled into the app for the
  # What's New card, which shows nothing at all for a release with no `whatsnew` block. No `if:`
  # — the notes are docs, so this has to run on exactly the PRs that skip the macOS lanes.
  release-notes:
    name: release-notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The release tooling's own tests
        run: node --test scripts/*.test.mjs
      - name: Every release has valid notes
        run: node scripts/release.mjs validate
      - name: Localization catalogs are valid (English complete, other languages optional)
        run: python3 scripts/check-localization.py

  attribution:
    name: attribution
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PATTERN: '(?i)^(co-authored-by|signed-off-by):.*(claude|anthropic|codex|openai|copilot|cursor|gemini|devin|aider)|generated (with|by) \[?(claude|codex|copilot|cursor|gemini|aider)|claude\.com/claude-code|🤖 generated'
    steps:
      - name: PR body and commit messages carry no attribution
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          pat = re.compile(os.environ["PATTERN"], re.M)
          repo = os.environ["GITHUB_REPOSITORY"]
          num = json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["number"]
          body = subprocess.check_output(["gh", "pr", "view", str(num), "-R", repo, "--json", "body", "--jq", ".body"], text=True)
          commits = subprocess.check_output(["gh", "api", f"repos/{repo}/pulls/{num}/commits", "--paginate", "--jq", ".[].commit.message"], text=True)
          bad = [t for t in ("PR body", "commit message") if pat.search(body if t == "PR body" else commits)]
          if bad:
              print(f"::error::attribution trailer found in: {', '.join(bad)} (CLAUDE.md / global rule)")
              sys.exit(1)
          print("attribution: clean")
          PY
