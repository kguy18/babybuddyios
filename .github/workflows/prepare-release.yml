name: Prepare Release

# Run by hand from main once the version PR has merged. It refuses unless
# main is that version with valid notes and the release is not yet published.
# Then it creates the App Store version if missing, sets What's New from
# Docs/release-notes.md, attaches the build and the App Review QR, and creates or updates the one
# draft GitHub Release. With submit=true it submits the version for review.
# Safe to rerun until the version is submitted.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 1.1 (must match project.yml on main)"
        required: true
      build:
        description: "Build number to attach (empty takes the newest processed build of the version)"
        required: false
        default: ""
      submit:
        description: "Submit for App Review"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create and edit the draft release

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment hands its secrets to main only.
    environment: release
    env:
      OP_ENVIRONMENT_IDS: ${{ secrets.OP_ENVIRONMENT_ID }} ${{ secrets.OP_ASC_ENVIRONMENT_ID }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      BUILD: ${{ inputs.build }}
      TAG: v${{ inputs.version }}
      # op signs in with the service account token alone and never waits for input.
      OP_BIOMETRIC_UNLOCK_ENABLED: "false"
      OP_CACHE: "false"
    steps:
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::run this from main, not $GITHUB_REF. Nothing was sent."; exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::\"$VERSION\" is not a marketing version such as 1.1. Nothing was sent."; exit 1
          fi
          if [ -n "$BUILD" ] && ! [[ "$BUILD" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::\"$BUILD\" is not a build number. Nothing was sent."; exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: latest

      # Everything that can be wrong on main is checked before App Store Connect is touched.
      - name: Main is that version, with notes, not yet published
        id: check
        run: |
          fail() { echo "::error::$1 Nothing was sent."; exit 1; }
          MAIN_V="$(node scripts/asc.mjs marketing-version)"
          [ "$MAIN_V" = "$VERSION" ] || fail "main is version $MAIN_V, not $VERSION. Merge the version PR first."
          node scripts/asc.mjs validate
          node scripts/asc.mjs notes "$VERSION" > "$RUNNER_TEMP/whats-new.txt"
          cat "$RUNNER_TEMP/whats-new.txt"
          # gh release view finds drafts; the REST "release by tag" endpoint does
          # not, and a lookup that missed the draft would make a second one.
          if DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "$DRAFT" = "true" ] || fail "$TAG is already published. A published release is never prepared again."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            fail "the tag $TAG exists without a release. Never move or delete it."
          fi

      # A 403 means the API key's role cannot edit App Store metadata; a 409
      # means the version is no longer editable. asc.mjs says so in the log.
      - name: Version, What's New, build
        id: asc
        timeout-minutes: 5
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_CONFIG_DIR: ${{ runner.temp }}/op
        run: |
          set -o pipefail
          # shellcheck disable=SC2016 # the inner script expands under op run, not here
          scripts/op-run.sh bash -eo pipefail -c '
            node scripts/asc.mjs version "$VERSION"
            node scripts/asc.mjs whats-new "$VERSION"
            node scripts/asc.mjs attach "$VERSION" ${BUILD:+"$BUILD"}
            # The App Review sign-in QR, kept in the 1Password Environment because it is a login.
            if [ -n "${APP_REVIEW_QR_PNG_BASE64:-}" ]; then
              printf %s "$APP_REVIEW_QR_PNG_BASE64" | base64 -d > "$RUNNER_TEMP/app-review-qr.png"
              node scripts/asc.mjs review-attachment "$VERSION" "$RUNNER_TEMP/app-review-qr.png"
              rm -f "$RUNNER_TEMP/app-review-qr.png"
            else
              echo "$VERSION: no APP_REVIEW_QR_PNG_BASE64 in the 1Password Environment, so no review attachment was sent"
            fi
            node scripts/asc.mjs status "$VERSION" --json > "$RUNNER_TEMP/status.json"
          ' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "build=$(jq -r '.build // empty' "$RUNNER_TEMP/status.json")" >> "$GITHUB_OUTPUT"

      # The target is this commit's full SHA, never main: GitHub creates the tag
      # when the draft is published, at whatever the target resolves to then.
      # Publish Release moves it to the shipped build's commit.
      - name: Draft the GitHub Release
        env:
          EXISTS: ${{ steps.check.outputs.exists }}
          ATTACHED: ${{ steps.asc.outputs.build }}
          BADGE: "[![Download on the App Store](https://raw.githubusercontent.com/kguy18/babybuddyios/main/Docs/app-store-badge.svg)](https://apps.apple.com/app/id6788966667)"
        run: |
          [ -n "$ATTACHED" ] || { echo "::error::App Store Connect shows no build on $VERSION."; exit 1; }
          {
            echo "$BADGE"; echo
            node scripts/asc.mjs body "$VERSION"
          } > "$RUNNER_TEMP/body.md"
          if [ "$EXISTS" = "true" ]; then
            gh release edit "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/body.md"
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/body.md"
          fi
          echo "Draft release: $(gh release view "$TAG" --json url --jq .url), build $ATTACHED" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Submit for review
        if: inputs.submit
        timeout-minutes: 5
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_CONFIG_DIR: ${{ runner.temp }}/op
        run: |
          set -o pipefail
          scripts/op-run.sh \
            node scripts/asc.mjs submit "$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summary
        env:
          SUBMIT: ${{ inputs.submit }}
        run: |
          if [ "$SUBMIT" = "true" ]; then
            echo "Next: Apple reviews $VERSION. Once it is approved and released in App Store Connect, run Publish Release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Next: run again with submit=true to submit $VERSION for review." >> "$GITHUB_STEP_SUMMARY"
          fi
