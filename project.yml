name: BabyBuddy
options:
  bundleIdPrefix: com.kurtisguy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.14.1

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "547DWTTFY6"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BabyBuddy:
    type: application
    platform: iOS
    sources:
      - path: Sources
    configFiles:
      Debug: Config/BabyBuddy.xcconfig
      Release: Config/BabyBuddy.xcconfig
    dependencies:
      - target: BabyBuddyWidgets
      - package: TelemetryDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kurtisguy.BabyBuddy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Baby Buddy uses Face ID to keep your baby's data private."
        INFOPLIST_KEY_NSCameraUsageDescription: "Baby Buddy uses the camera to scan the login QR code from your server's Add a Device page."
        INFOPLIST_KEY_UIBackgroundModes: "fetch"
    info:
      path: Sources/Info.plist
      properties:
        TelemetryDeckAppID: "$(TELEMETRYDECK_APP_ID)"
        BGTaskSchedulerPermittedIdentifiers:
          - com.kurtisguy.BabyBuddy.sync
        CFBundleURLTypes:
          - CFBundleURLName: com.kurtisguy.BabyBuddy
            CFBundleURLSchemes:
              - babybuddy
    entitlements:
      path: Sources/BabyBuddy.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kurtisguy.BabyBuddy
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kurtisguy.BabyBuddy

  BabyBuddyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Sources/Persistence
        excludes:
          - DemoData.swift
      - path: Sources/Networking
      - path: Sources/Auth/KeychainStore.swift
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kurtisguy.BabyBuddy.Widgets
        INFOPLIST_KEY_CFBundleDisplayName: "Baby Buddy"
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/BabyBuddyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kurtisguy.BabyBuddy
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kurtisguy.BabyBuddy

  BabyBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BabyBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kurtisguy.BabyBuddy.tests

schemes:
  BabyBuddy:
    build:
      targets:
        BabyBuddy: all
        BabyBuddyTests: [test]
    test:
      targets:
        - BabyBuddyTests
