name: Quackback status

# Moves the feedback.babybuddy.app requests an issue names, through its `Quackback: post_<id>`
# lines, as the issue moves: Planned when it opens, gains an ID or reopens, Complete when it closes
# as completed. Closed as not planned leaves them alone and says so in the job summary. Only
# Publish Release sets Shipped, and nothing here moves a post back from Shipped.
# A line counts in the body of an issue the owner or a collaborator opened, or in a comment one of
# them wrote on any issue, so a request can be linked to an issue a stranger opened.
# scripts/quackback.mjs holds the rules; Quackback's own GitHub status sync is off so the two
# can't fight.

on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited]

# One run at a time per issue, in order, so an edit and a close can't race.
concurrency:
  group: quackback-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read   # the issue's comments, on a close or reopen

jobs:
  status:
    name: status
    # Only text written by someone with access names a request; the script checks again. A
    # stranger's issue still runs on a close or reopen, for its trusted comments. Comments on PRs,
    # and bodies and comments with no `Quackback:` line, skip here.
    if: >-
      (github.event_name == 'issues' &&
        (github.event.action == 'closed' || github.event.action == 'reopened' ||
          (contains(github.event.issue.body, 'Quackback:') &&
            contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)))) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
        contains(github.event.comment.body, 'Quackback:') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read the issue's comments
        if: github.event_name == 'issues' && (github.event.action == 'closed' || github.event.action == 'reopened')
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq '.[] | {author_association, body} | tojson' > "$RUNNER_TEMP/comments.jsonl"
      - name: Set the requests' status
        env:
          QUACKBACK_API_KEY: ${{ secrets.QUACKBACK_API_KEY }}
        run: |
          COMMENTS="$RUNNER_TEMP/comments.jsonl"
          [ -f "$COMMENTS" ] || COMMENTS=
          node scripts/quackback.mjs issue "$GITHUB_EVENT_PATH" ${COMMENTS:+"$COMMENTS"}
